version: '3.8'

services:
  # ==========================================
  # Frontend (React + TypeScript)
  # ==========================================
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    networks:
      - app_network
    depends_on:
      - core-api

  # ==========================================
  # Backend (Spring Boot Core API)
  # ==========================================
  core-api:
    build:
      context: ./core-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/esquina_veiculos
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # Agent Service (FastAPI / AI)
  # ==========================================
  agent-service:
    image: python:3.11-slim
    # Trocar para inicialização do FastAPI
    command: ["sleep", "infinity"]
    ports:
      - "8000:8000"
    networks:
      - app_network
    depends_on:
      - n8n
      - core-api

  # ==========================================
  # Banco de Dados (PostgreSQL + pgvector)
  # ==========================================
  postgres:
    image: ankane/pgvector:latest
    environment:
      - POSTGRES_DB=esquina_veiculos
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # n8n (Workflows & Notificações)
  # ==========================================
  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - app_network

  # ==========================================
  # WAHA (WhatsApp API)
  # ==========================================
  waha:
    image: devlikeapro/waha:latest
    ports:
      - "3001:3000"
    environment:
      - WHATSAPP_DEFAULT_ENGINE=WEBJS
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
